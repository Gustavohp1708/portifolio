<div class="portfolio-layout">
  <app-sidebar
    [name]="profile.name"
    [title]="profile.title"
    [photoInitials]="profile.photoInitials"
    [photoUrl]="profile.photoUrl"
    [contact]="profile.contact"
    [stacks]="stacks"
  ></app-sidebar>

  <main class="main-content">
    <section class="hero-panel" aria-labelledby="portfolio-title">
      <p class="hero-panel__eyebrow">{{ profile.title }}</p>
      <h2 id="portfolio-title">{{ profile.name }}</h2>
      <p>
        Desenvolvedor com foco em back-end, APIs REST e soluções
        modernas com Java, Spring Boot, Angular e bancos relacionais.
      </p>
    </section>

    <section class="content-section about-section" aria-labelledby="about-title">
      <app-section-heading title="Sobre"></app-section-heading>
      <div class="about-card">
        <p *ngFor="let paragraph of aboutText">{{ paragraph }}</p>
      </div>
    </section>

    <app-knowledge [items]="knowledgeItems"></app-knowledge>
    <app-experience-carousel [experiences]="experiences"></app-experience-carousel>
    <app-education [items]="educationItems"></app-education>
    <app-certificates [certificates]="certificates"></app-certificates>
  </main>
</div>
