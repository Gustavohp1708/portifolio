<section class="content-section" aria-labelledby="experience-title">
  <div class="section-toolbar">
    <app-section-heading title="Experiências Profissionais"></app-section-heading>
    <div class="carousel-actions" aria-label="Navegação de experiências">
      <button type="button" (click)="scroll('previous')" aria-label="Experiência anterior">‹</button>
      <button type="button" (click)="scroll('next')" aria-label="Próxima experiência">›</button>
    </div>
  </div>

  <div class="experience-carousel" #carousel>
    <article class="experience-card" *ngFor="let experience of experiences">
      <p class="experience-card__period">{{ experience.period }}</p>
      <h3>{{ experience.role }}</h3>
      <strong>{{ experience.company }}</strong>
      <p>{{ experience.description }}</p>
    </article>
  </div>
</section>
